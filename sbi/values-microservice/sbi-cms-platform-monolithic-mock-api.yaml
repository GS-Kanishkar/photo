deployment:
  name: sbi-cms-platform-monolithic-mock-api
  namespace: "{{ $.Values.environment.namespace }}"
  containerPort: 8080
  nodeSelector: "{{ $.Values.environment.nodeSelector }}"

containers:
  image: "{{ $.Values.images.sbi_cms_platform_monolithic_mock_api }}"

  ports:
    - containerPort: 8080
      protocol: TCP

opentelementry:
  required: false

service:
  required: true
  ports:
    - name: 8080-8080
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP

configmap:
  required: true

hpa:
  minReplicas: "{{ $.Values.hpas.minreplica }}"
  maxReplicas: "{{ $.Values.hpas.maxreplica }}"

ingress:
  required: true
  ingressClassName: cilium
  paths:
    - path: /sbi/sbi-cms-monolithic-mock
      backendServiceName: sbi-cms-platform-monolithic-mock-api
      backendServicePort: 8080

route:
  required: true
  path: /sbi/sbi-cms-monolithic-mock
  targetPort: 8080

applicationConfig:
  SERVER_PORT: "8080"

mysqlhost: false
redishost: false
kafkahost: false

publickeycert:
  required: true

serviceAccount:
  required: true
  roleARN: "{{ $.Values.role.arn }}"
