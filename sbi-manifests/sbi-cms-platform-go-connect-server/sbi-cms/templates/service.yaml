---
# Source: sbi-cms/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: sbi-cms-platform-go-connect-server
  namespace: sbi
  labels:
    app: sbi-cms-platform-go-connect-server
  annotations: 
    prometheus.io/path: '/actuator/prometheus'
    prometheus.io/port: '8291-8291'
    prometheus.io/scrape: 'true'
spec:
  ports:
    - protocol: TCP
      port: 8291
      targetPort: 8291
      name: 8291-8291
    - protocol: TCP
      port: 6001
      targetPort: 6001
      name: 6001-6001
  selector:
    app: sbi-cms-platform-go-connect-server
  type: NodePort
