---
# Source: sbi-cms/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sbi-cms-platform-dev-gc-base24-classic-f1
  namespace: sbi
spec:
  scaleTargetRef:
    kind: Deployment
    name: sbi-cms-platform-dev-gc-base24-classic-f1
    apiVersion: apps/v1
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 100
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 100
