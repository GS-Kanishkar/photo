deployment:
  name: sbi-cms-platform-java-connect
  namespace: "{{ $.Values.environment.namespace }}"
  containerPort: 8080
  nodeSelector: "{{ $.Values.environment.nodeSelector }}"

containers:
  image: "{{ $.Values.images.sbi_cms_platform_java_connect }}"

  ports:
  - containerPort: 8080
    protocol: TCP

opentelementry:
  required: false

service:
  required: true
  ports:
  - name: 8080-8080
    protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP

configmap:
  required: true

hpa:
  minReplicas: "{{ $.Values.hpas.minreplica }}"
  maxReplicas: "{{ $.Values.hpas.maxreplica }}"

ingress:
  required: true
  ingressClassName: cilium
  paths:
    - path: /sbi/javaconnect
      backendServiceName: sbi-cms-platform-java-connect
      backendServicePort: 8080

route:
  required: true
  path: /sbi/javaconnect
  targetPort: 8080   

applicationConfig:
  DATASOURCE_DRIVER: "{{ $.Values.url.DATASOURCE_DRIVER }}"
  DATASOURCE_URL: "{{ $.Values.url.DATASOURCE_URL }}"
  DATASOURCE_USERNAME: "{{ $.Values.url.DATASOURCE_USERNAME }}"
  DATASOURCE_PASSWORD: "{{ $.Values.url.DATASOURCE_PASSWORD }}"
  DATASOURCE_DIALECT: "{{ $.Values.url.DATASOURCE_DIALECT }}"
  DATASOURCE_SCHEMA: "{{ $.Values.url.DATASOURCE_SCHEMA }}"
  UAM_API_DNS: "{{ $.Values.url.UAM_API_DNS }}"
  SERVICE_ACCESS_KEY: "{{ $.Values.url.SERVICE_API_KEY }}"
  SERVICE_ACCESS_NAME: "{{ $.Values.url.SERVICE_API_NAME_PREFIX }}java-connect"
  JASYPT_PASSWORD: "{{ $.Values.url.JASYPT_PASSWORD }}"
  GOCONNECT_PRODUCT_LIST_URL: "{{ $.Values.url.GOCONNECT_PRODUCT_LIST_URL }}"
  ALERT_APPLICABLE: "{{ $.Values.config.ALERT_APPLICABLE }}"
  CONTEXT_PATH: "/sbi/javaconnect"
  NATS_CONNECTION_URL: "{{ $.Values.url.NATS_URL }}"



mysqlhost: true
redishost: false
kafkahost: true
publickeycert:
  required: false
serviceAccount:
  required: true
  roleARN: "{{ $.Values.role.arn }}"  
  