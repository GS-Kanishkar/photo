  SFTP_REMOTE_DIR: "{{ $.Values.sftp.SFTP_REMOTE_DIR }}" 
  SFTP_USER_ID: "{{ $.Values.sftp.SFTP_USER_ID }}"
  KAFKA_HOST: "{{ $.Values.kafka.KAFKA_HOST }}"
  KAFKA_PORT: "{{ $.Values.kafka.KAFKA_PORT }}"
  CUSTOMER_ONBOARD_TEMPLATE: CUSTOMER_ONBOARDING_PHY
  SECURITY_ASYMMETRIC_CBS_PRIVATEKEY_FILE: "{{ $.Values.config.SECURITY_ASYMMETRIC_CBS_PRIVATEKEY_FILE }}"
  SECURITY_ASYMMETRIC_CBS_PUBLICKEY_FILE: "{{ $.Values.config.SECURITY_ASYMMETRIC_CBS_PUBLICKEY_FILE }}"

mysqlhost: true
redishost: false
kafkahost: true

publickeycert:
  required: true

serviceAccount:
  required: true
  roleARN: "{{ $.Values.role.arn }}"