---
# Source: sbi-cms/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbi-cms-issuance-card-management-extn
  namespace: sbi
  labels:
    app: sbi-cms-issuance-card-management-extn
    intent: apps
spec:
  selector:
    matchLabels:
      app: sbi-cms-issuance-card-management-extn
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: sbi-cms-issuance-card-management-extn
        intent: apps
      annotations:
        kubernetes.io/psp: eks.privileged
        "fss.com/app-configmap-hash": c854bf22f788daea0abecfa46825edecc7cc0296c1ddd3b735a7750699e37ed4
    spec:
      serviceAccountName: sbi-cms-issuance-card-management-extn-sa
      volumes:
        - name: key-cert-vol
          configMap:
            name: public-private-key
        - name: visa-npci-key-configmap-volume
          configMap:
            name: visa-npci-key-configmap
        - name: dcms-keys-volume
          configMap:
            name: dcms-keys-configmap
        - name: sbi-keys-volume
          configMap:
            name: sbi-keys-configmap
      containers:
        - name: sbi-cms-issuance-card-management-extn
          image: 736483234466.dkr.ecr.ap-south-1.amazonaws.com/sbi-cms-issuance-card-management-extn:sbi-uat.v257
          volumeMounts:
            - name: key-cert-vol
              mountPath: /config
            - name: visa-npci-key-configmap-volume
              mountPath: /data
            - name: dcms-keys-volume
              mountPath: /vol
            - name: sbi-keys-volume
              mountPath: /sbi
          ports:
            - containerPort: 8063
