deployment:
  name: sbi-cms-platform-go-exchange-rate-mapper
  namespace: "{{ $.Values.environment.namespace }}"
  containerPort: 5522
  nodeSelector: "{{ $.Values.environment.nodeSelector }}"

containers:
  image: "{{ $.Values.images.sbi_cms_platform_go_exchange_rate_mapper }}"

  ports:
    - containerPort: 5522
      protocol: TCP

opentelementry:
  required: false

service:
  required: true
  ports:
    - name: 5522-5522
      protocol: TCP
      port: 5522
      targetPort: 5522
  type: ClusterIP

configmap:
  required: true

hpa:
  minReplicas: "{{ $.Values.hpas.minreplica }}"
  maxReplicas: "{{ $.Values.hpas.maxreplica }}"

ingress:
  required: true
  ingressClassName: cilium
  paths:
    - path: /sbi/platform/go-exchange-rate-mapper
      backendServiceName: sbi-cms-platform-go-exchange-rate-mapper
      backendServicePort: 5522

route:
  required: true
  path: /sbi/platform/go-exchange-rate-mapper
  targetPort: 5522

applicationConfig:
  APP_NAME: "GO-EXCHNAGE-RATE-MAPPER"
  APP_DESC: "This application will connect on TCP Protocol with other application. This is written in GO."
  APP_COPYRIGHT: "© 2023 Financial Software and Systems"
  APP_ENV: "{{ $.Values.environment.env}}"
  PORT: "5522"
  NATS_CONNECTION_URL: "{{ $.Values.url.NATS_URL }}"
  IS_MASK: "N"
  SERVICE_NAME: "go-exchange-rate-mapper"
  UAM_API_DNS: "{{ $.Values.environment.UAM_API_DNS }}"
  UAM_API_PROTOCOL: "{{ $.Values.environment.UAM_API_PROTOCOL }}"
  UAM_API_ENDPOINT: "{{ $.Values.environment.UAM_API_ENDPOINT }}"
  UAM_CHECK_REQUIRED: "{{ $.Values.url.UAM_CHECK_REQUIRED }}"
  DATASOURCE_HOST: "{{ $.Values.url.DATASOURCE_HOST }}"
  DATASOURCE_PORT: "{{ $.Values.url.DATASOURCE_PORT }}"
  DATASOURCE_DB: "{{ $.Values.url.DATASOURCE_DB }}"
  DATASOURCE_SCHEMA: "{{ $.Values.url.DATASOURCE_SCHEMA_PREFIX }}GO_CONNECT"
  DB_SSL_MODE: "{{ $.Values.url.DB_SSL_MODE }}"
  DATASOURCE_USERNAME: "{{ $.Values.url.DATASOURCE_USERNAME }}"
  DATASOURCE_PASSWORD: "{{ $.Values.url.DATASOURCE_PASSWORD }}"
  DATASOURCE_DBTYPE: "{{ $.Values.url.DATASOURCE_DBTYPE }}"
  JASYPT_PASSWORD: "{{ $.Values.url.JASYPT_PASSWORD }}"
  OTEL_SERVICE_NAME: "GO_EXCHANGE_RATE_MAPPER"
  INSECURE_MODE: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ $.Values.url.OTEL_EXPORTER_OTLP_ENDPOINT }}"
  SERVICE_API_KEY: "{{ $.Values.url.SERVICE_API_KEY }}"
  SECURITY_SYMMETRIC_ENCDEC_CIPHER_ALGORITHM: "{{ $.Values.url.SECURITY_SYMMETRIC_ENCDEC_CIPHER_ALGORITHM }}"
  SECURITY_SYMMETRIC_ENCDEC_KEY: "{{ $.Values.url.SECURITY_SYMMETRIC_ENCDEC_KEY }}"
  SECURITY_SYMMETRIC_ENCDEC_KEY_ALGORITHM: "AES"
  APP_CONTEXT_PATH: "/sbi/platform/go-exchange-rate-mapper"
  USE_TLS: "{{ $.Values.url.USE_TLS_EXCHANGE_RATE_MAPPER }}" 
  CLIENT_CERT_PATH: "{{ $.Values.url.EXCHNGRM_CLIENT_CERT_PATH }}"
  CLIENT_KEY_PATH: "{{ $.Values.url.EXCHNGRM_CLIENT_KEY_PATH }}"
  CA_CERT_PATH: "{{ $.Values.url.EXCHNGRM_CA_CERT_PATH }}"
  CA_CERT_PROVIDER_SERVER: "{{ $.Values.url.EXCHNGRM_CA_CERT_PROVIDER_SERVER }}"


mysqlhost: false
redishost: false
kafkahost: false

publickeycert:
  required: true

serviceAccount:
  required: true
  roleARN: "{{ $.Values.role.arn }}"