deployment:
  name: sbi-cms-issuance-hsm-connect
  namespace: "{{ $.Values.environment.namespace }}"
  containerPort: 8062
  nodeSelector: sbi

containers:
  image: "{{ $.Values.images.sbi_cms_issuance_hsm_connect }}"

  ports:
  - containerPort: 8062
    protocol: TCP

opentelementry:
  required: false

service:
  required: true
  ports:
  - name: 8062-8062
    protocol: TCP
    port: 8062
    targetPort: 8062
  type: ClusterIP

configmap:
  required: false

hpa:
  minReplicas: "{{ $.Values.hpas.minreplica }}"
  maxReplicas: "{{ $.Values.hpas.maxreplica }}"

ingress:
  required: true
  ingressClassName: cilium
  paths:
    - path: /sbi/hsm-connector
      backendServiceName: sbi-cms-issuance-hsm-connect
      backendServicePort: 8062

route:
  required: false
  path: /sbi/hsm-connector
  targetPort: 8062   

applicationConfig:
  TOKEN_SIGNING_KEY: "{{ $.Values.security.TOKEN_SIGNING_KEY }}"
  TOKEN_EXPIRY: "{{ $.Values.security.TOKEN_EXPIRY }}"
  SYSTEM_USER: "{{ $.Values.security.SYSTEM_USER }}"
  CMS_USER_ACCESS_MANAGEMENT_API: "{{ $.Values.services.CMS_USER_ACCESS_MANAGEMENT_API }}"
  JASYPT_PASSWORD: "{{ $.Values.url.JASYPT_PASSWORD }}"
  ALERT_APPLICABLE: "{{ $.Values.config.ALERT_APPLICABLE }}"

mysqlhost: false
redishost: false
kafkahost: false
publickeycert:
  required: false
serviceAccount:
  required: false
  roleARN: "{{ $.Values.role.arn }}"  
  