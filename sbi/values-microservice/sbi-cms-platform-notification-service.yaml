deployment:
  name: sbi-cms-platform-notification-service
  namespace: "{{ $.Values.environment.namespace }}"
  containerPort: 8096
  nodeSelector: "{{ $.Values.environment.nodeSelector }}"

containers:
  image: "{{ $.Values.images.sbi_cms_platform_notification_service }}"

  ports:
  - containerPort: 8096
    protocol: TCP

opentelementry:
  required: false

service:
  required: true
  ports:
  - name: 8096-8096
    protocol: TCP
    port: 8096
    targetPort: 8096
  type: ClusterIP
  
configmap:
  required: true  

hpa:
  minReplicas: "{{ $.Values.hpas.minreplica }}"
  maxReplicas: "{{ $.Values.hpas.maxreplica }}"

ingress:
  required: true
  ingressClassName: cilium
  paths:
    - path: /sbi/notification
      backendServiceName: sbi-cms-platform-notification-service
      backendServicePort: 8096

route:
  required: true
  path: /sbi/notification
  targetPort: 8096  

applicationConfig:
  TOKEN_SIGNING_KEY: "{{ $.Values.security.TOKEN_SIGNING_KEY }}"
  TOKEN_EXPIRY: "{{ $.Values.security.TOKEN_EXPIRY }}"
  SYSTEM_USER: "{{ $.Values.security.SYSTEM_USER }}"
  CMS_USER_ACCESS_MANAGEMENT_API: "{{ $.Values.services.CMS_USER_ACCESS_MANAGEMENT_API }}"
  JASYPT_PASSWORD: "{{ $.Values.url.JASYPT_PASSWORD }}"
  MYSQL_HOST: "{{ $.Values.database.MYSQL_HOST }}"
  MYSQL_USER: "{{ $.Values.database.mysql.MYSQL_USER }}"
  MYSQL_PASSWORD: "{{ $.Values.database.mysql.MYSQL_PASSWORD }}"
  MYSQL_SCHEMA_PREFIX: "{{ $.Values.database.mysql.MYSQL_SCHEMA_PREFIX }}"
  ORACLE_HOST: "{{ $.Values.database.oracle.ORACLE_HOST }}"
  ORACLE_USER: "{{ $.Values.database.oracle.ORACLE_USER }}"
  ORACLE_PASSWORD: "{{ $.Values.database.oracle.ORACLE_PASSWORD }}"
  ORACLE_SCHEMA_PREFIX: "{{ $.Values.database.oracle.ORACLE_SCHEMA_PREFIX }}"
  POSTGRES_HOST: "{{ $.Values.database.postgres.POSTGRES_HOST }}"
  POSTGRES_USER: "{{ $.Values.database.postgres.POSTGRES_USER }}"
  POSTGRES_PASSWORD: "{{ $.Values.database.postgres.POSTGRES_PASSWORD }}"
  POSTGRES_SCHEMA_PREFIX: "{{ $.Values.database.postgres.POSTGRES_SCHEMA_PREFIX }}"
  BUCKET_NAME: "{{ $.Values.security.BUCKET_NAME }}"
  ORACLE_PORT: "{{ $.Values.database.oracle.ORACLE_PORT }}"
  ORACLE_SERVICE_NAME: "{{ $.Values.database.oracle.ORACLE_SERVICE_NAME }}"
  ALERT_APPLICABLE: "{{ $.Values.config.ALERT_APPLICABLE }}"
  SCHEMA: "{{ $.Values.schemaNames.NOTIFICATION_SCHEMA }}"
  ALLOWED_ORIGINS: "{{ $.Values.cors.ALLOWED_ORIGINS }}"
  KAFKA_HOST: "{{ $.Values.kafka.KAFKA_HOST }}"
  KAFKA_PORT: "{{ $.Values.kafka.KAFKA_PORT }}"
  EMAIL_HOST: "{{ $.Values.url.EMAIL_HOST }}"
  EMAIL_PORT: "{{ $.Values.url.EMAIL_PORT }}"
  EMAIL_USERNAMES: "{{ $.Values.url.EMAIL_USERNAMES }}"
  EMAIL_PASSWORDS: "{{ $.Values.url.EMAIL_PASSWORDS }}"
  EMAIL_SENDERS: "{{ $.Values.url.EMAIL_SENDERS }}"
  EMAIL_SMTP_AUTH: "{{ $.Values.url.EMAIL_SMTP_AUTH }}"
  EMAIL_SMTP_STARTTLS_ENABLE: "{{ $.Values.url.EMAIL_SMTP_STARTTLS_ENABLE }}"
  SMS_IMPLEMENTATION: "{{ $.Values.url.SMS_IMPLEMENTATION }}"
  VALUEFIRST_API_URL: "{{ $.Values.url.VALUEFIRST_API_URL }}"
  VALUEFIRST_USERNAME: "{{ $.Values.url.VALUEFIRST_USERNAME }}"
  VALUEFIRST_AUTH_TOKEN: "{{ $.Values.url.VALUEFIRST_AUTH_TOKEN }}"
  VALUEFIRST_SENDER_ID: "{{ $.Values.url.VALUEFIRST_SENDER_ID }}"
  NOTIFICATION_ACTIVE_PROFILES: "kafka,async-notifier,dev"
  SBI_SMS_API_URL: "{{ $.Values.url.SBI_SMS_API_URL }}"
  SBI_SMS_USERNAME: "{{ $.Values.url.SBI_SMS_USERNAME }}"
  SBI_SMS_PASSWORD: "{{ $.Values.url.SBI_SMS_PASSWORD }}"
  SBI_SMS_SENDER_ID: "{{ $.Values.url.SBI_SMS_SENDER_ID }}"
  SBI_SMS_CHARGING: "{{ $.Values.url.SBI_SMS_CHARGING }}"
  SBI_SMS_ACCOUNT: "{{ $.Values.url.SBI_SMS_ACCOUNT }}"
  SFTP_HOST: "{{  $.Values.sftp.SFTP_HOST }}"
  SFTP_PORT: "{{  $.Values.sftp.SFTP_PORT }}"
  SFTP_USER_ID: "{{  $.Values.sftp.SFTP_USER_ID }}"
  SFTP_PASS: "{{  $.Values.sftp.SFTP_PASS }}"
  SFTP_REMOTE_DIR: "{{  $.Values.sftp.SFTP_REMOTE_DIR }}"
  REDIS_HOST: "{{ $.Values.redis.REDIS_HOST }}"
  REDIS_PORT: "{{ $.Values.redis.REDIS_PORT }}"


mysqlhost: true
redishost: true
kafkahost: true
publickeycert:
  required: false
serviceAccount:
  required: true
  roleARN: "{{ $.Values.role.arn }}"  
